root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = ["--domain localhost", "--sessionTimeout 168h", '--organization "103d LRS"', "--dev", "--hashCost 4"]
  bin = "./tmp/main"
  cmd = "templ generate && minify -r --match .*\\.css -o server/assets/css/index.min.css templates/ && go build -o ./tmp/main ."
  delay = 1000
  exclude_dir = ["frontend", "tmp", "vendor", "testdata"]
  exclude_file = ["server/assets/css/index.min.css"]
  exclude_regex = ["_test.go", ".*_templ.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html", "gohtml", "css", "templ"]
  include_file = ["config.yml", "api.yaml"]
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = false

[proxy]
  app_port = 0
  enabled = false
  proxy_port = 0

[screen]
  clear_on_rebuild = false
  keep_scroll = true
